services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: kiliwvatg
      POSTGRES_USER: kiliwvatg
      POSTGRES_PASSWORD: kiliwvatg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: bash -lc "pip install -e . && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://kiliwvatg:kiliwvatg@db:5432/kiliwvatg
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  pgdata:
