[project]
name = "kiliwvatgbot"
version = "0.1.0"
description = "Telegram shop bot + admin panel backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.32",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  "pydantic-settings>=2.4.0",
  "aiogram>=3.10.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "httpx>=0.27.0",
  "pytest-asyncio>=0.23.8"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
